<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passwort zurücksetzen — FHR-Vorbereitung</title>
    <link rel="stylesheet" href="assets/styles.css">
    <link rel="stylesheet" href="assets/atlas.css">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
</head>
<body class="auth-body">
    <a class="skip-link" href="#main">Zum Inhalt springen</a>
    <main id="main" class="auth-main" tabindex="-1">
        <div class="auth-card">
            <a href="login.html" class="app-brand app-brand--center" aria-label="Zur Anmeldung">
                <span class="app-brand__mark" aria-hidden="true">
                    <svg viewBox="0 0 128 128" width="52" height="52" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M40 38 Q28 50 30 70 Q26 76 32 84 Q24 90 32 100 Q26 108 38 110 Q40 118 50 116 Q44 122 50 124 L52 96 Q48 80 52 60 Q48 46 56 38 Z" fill="#e14d6e" stroke="#c83a5b" stroke-width="1.5" stroke-linejoin="round"/>
                        <path d="M88 38 Q100 50 98 70 Q102 76 96 84 Q104 90 96 100 Q102 108 90 110 Q88 118 78 116 Q84 122 78 124 L76 96 Q80 80 76 60 Q80 46 72 38 Z" fill="#e14d6e" stroke="#c83a5b" stroke-width="1.5" stroke-linejoin="round"/>
                        <path d="M52 32 L46 18 L60 28 Z" fill="#e14d6e" stroke="#c83a5b" stroke-width="1.4" stroke-linejoin="round"/>
                        <path d="M76 32 L82 18 L68 28 Z" fill="#e14d6e" stroke="#c83a5b" stroke-width="1.4" stroke-linejoin="round"/>
                        <path d="M64 36 Q44 36 40 56 Q36 72 44 86 Q48 100 64 100 Q80 100 84 86 Q92 72 88 56 Q84 36 64 36 Z" fill="#fff1e0" stroke="#c83a5b" stroke-width="1.8" stroke-linejoin="round"/>
                        <ellipse cx="64" cy="84" rx="14" ry="10" fill="#fff3e2" stroke="#c83a5b" stroke-width="1.4"/>
                        <path d="M58 38 Q64 30 70 38 Q66 50 64 48 Q62 50 58 38 Z" fill="#e14d6e" stroke="#c83a5b" stroke-width="1.4"/>
                        <ellipse cx="55" cy="68" rx="4.5" ry="5.5" fill="#3a1e2c"/>
                        <ellipse cx="73" cy="68" rx="4.5" ry="5.5" fill="#3a1e2c"/>
                        <circle cx="56.5" cy="66.5" r="1.6" fill="#fff"/>
                        <circle cx="74.5" cy="66.5" r="1.6" fill="#fff"/>
                        <circle cx="50" cy="80" r="3.5" fill="#f7a9b8" opacity="0.6"/>
                        <circle cx="78" cy="80" r="3.5" fill="#f7a9b8" opacity="0.6"/>
                        <path d="M56 88 Q64 96 72 88" stroke="#3a1e2c" stroke-width="2" fill="#f7a9b8" stroke-linecap="round" opacity="0.9"/>
                        <path d="M40 110 Q60 122 88 110 Q86 124 64 126 Q42 124 40 110 Z" fill="#fff1e0" stroke="#c83a5b" stroke-width="1.6" stroke-linejoin="round"/>
                        <path d="M42 116 Q30 122 28 130" stroke="#46b890" stroke-width="5" fill="none" stroke-linecap="round"/>
                    </svg>
                </span>
                <span class="app-brand__text">
                    <span class="app-brand__name">Wunderatlas ✳</span>
                    <span class="app-brand__sub">Neues Passwort</span>
                </span>
            </a>
            <h1 class="auth-title">Neues Passwort setzen</h1>
            <p class="muted" id="status">Lade …</p>
            <form id="form" novalidate hidden>
                <label for="password">Neues Passwort (mind. 8 Zeichen)
                    <span class="pw-field">
                        <input class="input" id="password" name="password" type="password" autocomplete="new-password" required minlength="8">
<button class="pw-toggle" type="button" data-action="toggle-pw" data-target="password" aria-label="Passwort anzeigen" aria-pressed="false">
                            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </span>
                </label>
                <label for="password2">Passwort bestätigen
                    <span class="pw-field">
                        <input class="input" id="password2" name="password2" type="password" autocomplete="new-password" required minlength="8">
                        <button class="pw-toggle" type="button" data-action="toggle-pw" data-target="password2" aria-label="Passwort anzeigen" aria-pressed="false">
                            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </span>
                </label>
                <div id="error" class="form-error" role="alert" hidden></div>
                <button class="btn btn--primary btn--block" id="submit" type="submit">Passwort speichern</button>
            </form>
            <div class="auth-links">
                <a href="login.html">Zur Anmeldung</a>
            </div>
        </div>
    </main>
    <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>
    <script src="assets/icons.js"></script>
    <script src="assets/exercises/engine.js"></script>
    <script src="assets/auth.js"></script>
    <script>
        (function () {
            const params = new URLSearchParams(location.search);
            const token = params.get('token') || '';
            const status = document.getElementById('status');
            const form = document.getElementById('form');
            const errorEl = document.getElementById('error');
            const submit = document.getElementById('submit');
            if (!token) {
                status.textContent = 'Token fehlt. Bitte fordere einen neuen Link an.';
            } else {
                status.textContent = 'Token erkannt. Wähle ein neues Passwort.';
                form.hidden = false;
            }

            // Show/hide password toggles.  Pure UI — never call
            // event.preventDefault() so password managers and IME input
            // keep working normally.  We just flip the input type.
            document.querySelectorAll('[data-action="toggle-pw"]').forEach(btn => {
                const targetId = btn.getAttribute('data-target');
                const input = document.getElementById(targetId);
                if (!input) return;
                btn.addEventListener('click', () => {
                    const showing = input.type === 'text';
                    input.type = showing ? 'password' : 'text';
                    btn.setAttribute('aria-pressed', showing ? 'false' : 'true');
                    btn.setAttribute('aria-label', showing ? 'Passwort anzeigen' : 'Passwort verbergen');
                });
            });
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorEl.hidden = true;
                const pw = document.getElementById('password').value;
                const pw2 = document.getElementById('password2').value;
                if (pw.length < 8) return showError('Passwort muss mindestens 8 Zeichen lang sein.');
                if (pw !== pw2) return showError('Passwörter stimmen nicht überein.');
                submit.disabled = true;
                submit.classList.add('is-loading');
                try {
                    await window.Auth.reset(token, pw);
                    ExerciseEngine.toast('Passwort aktualisiert. Bitte anmelden.', 'ok');
                    location.href = 'login.html?reset=1';
                } catch (err) {
                    showError(err.message || 'Zurücksetzen fehlgeschlagen.');
                } finally {
                    submit.disabled = false;
                    submit.classList.remove('is-loading');
                }
            });
            function showError(msg) { errorEl.textContent = msg; errorEl.hidden = false; }
        })();
    </script>
</body>
</html>
